version: '3.9'

services:
#  nginx:
#    image: nginx:1.27-alpine
#    container_name: nginx-proxy
#    ports:
#      - "80:80"
#      - "443:443"
#    volumes:
#      - ./nginx/conf.d:/etc/nginx/conf.d:ro
#      - ./certbot/www:/var/www/certbot
#      - ./certbot/conf:/etc/letsencrypt
#    depends_on:
#      - iam
#    networks:
#      - iam-network

  nginx-lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx-lb/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - iam-1
      - iam-2
      - iam-3
    networks:
      - iam-network
    restart: unless-stopped

  iam-1:
    image: todimuisewon/customized-iam:v1.0.0
    ports:
      - "9081:8080"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - iam-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "true" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  iam-2:
    image: todimuisewon/customized-iam:v1.0.0
    ports:
      - "9082:8080"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - iam-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "true" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  iam-3:
    image: todimuisewon/customized-iam:v1.0.0
    ports:
      - "9083:8080"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - iam-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "true" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  database:
    image: mysql:8.0.39
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: keycloak
    volumes:
      - iam-volume:/var/lib/mysql
    networks:
      - iam-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword" ]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 40s

networks:
  iam-network:
    driver: bridge

volumes:
  iam-volume:
    driver: local